version: '3.9'

services:
  # ==================== MongoDB ====================
  mongodb:
    image: mongo:7
    container_name: microservice_mongodb
    restart: unless-stopped
    ports:
      - "17017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: mongodb_microservice
    volumes:
      - mongo_data:/data/db
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test -u admin -p root --authenticationDatabase admin --quiet 2>/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 20s

  # ==================== Zookeeper ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: microservice_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      SERVER_JVMFLAGS: "-Dcom.sun.management.jmxremote=false"
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ==================== Kafka ====================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: microservice_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ==================== Kafka UI ====================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: microservice_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8888:8080"   # Kafka UI
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
      LOGGING_LEVEL_COM_PROVECTUS: "DEBUG"
      LOGGING_LEVEL_ROOT: "INFO"
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:8080 | grep -q title || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ==================== Jaeger (Tracing) ====================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: microservice_jaeger
    restart: unless-stopped
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"   # UI
      - "14250:14250"   # gRPC receiver
      - "14268:14268"   # HTTP receiver
      - "14269:14269"   # Admin metrics
    networks:
      - microservice_network
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:14269/ > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==================== OpenTelemetry Collector ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: microservice_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # Health check
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:13133/healthz | grep -q ok || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ==================== Go Microservice ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microservice_app
    restart: unless-stopped
    ports:
      - "8080:8080"    # REST API
      - "50051:50051"  # gRPC
    environment:
      PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:8080/healthcheck | grep -q ok || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ==================== Kong API Gateway ====================
  kong:
    image: kong:3.4
    container_name: microservice_kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"   # Gateway (Proxy)
      - "8001:8001"   # Admin API
    volumes:
      - ./config/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - microservice_network
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://localhost:8001/status | grep -q version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

# ==================== Networks ====================
networks:
  microservice_network:
    driver: bridge

# ==================== Volumes ====================
volumes:
  mongo_data:
    driver: local